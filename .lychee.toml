# Used by the docs link jobs in .github/workflows/global-lint.yaml.
# Fragments stay off: the failures we care about are missing pages, and
# fragment checks are much slower.
# Each site job passes --root-dir set to its content folder, so a link like
# /docs/foo/ resolves to that folder's docs/foo, and --fallback-extensions
# md,mdx finds docs/foo.mdx. Pages have no extension in their URL, so a link
# with one is a static file, and the remaps below send it to the site's public
# folder. docs/public is served at the site root, and docs-v2/public under /docs.

verbose = "error"
no_progress = true

max_retries = 5
retry_wait_time = 2
timeout = 20
max_concurrency = 32
# A slow site is not a dead link.
accept_timeouts = true

# 200 and 206 are success. 429 is GitHub rate limiting, not a dead link.
# 401, 403, and 5xx are blocked or inconclusive, so they do not fail the run.
accept = ["200", "206", "401", "403", "429", "500..=599"]

scheme = ["http", "https"]
include_fragments = "none"
include_verbatim = false
include_mail = false
exclude_loopback = true

exclude = [
  '^mailto:',
  '^https?://(www\.)?example\.(com|org|net)(/|$)',
  '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:|/|$)',
]

remap = [
  '^(file://.*)/docs/content/(.+\.[A-Za-z0-9]+)$ $1/docs/public/$2',
  '^(file://.*)/docs-v2/src/content/docs/(.+\.[A-Za-z0-9]+)$ $1/docs-v2/public/$2',
]

[hosts."github.com"]
concurrency = 4
request_interval = "200ms"

[hosts."docs.rs"]
concurrency = 8
request_interval = "100ms"
