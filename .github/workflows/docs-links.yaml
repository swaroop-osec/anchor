# Dead links in the docs and docs-v2 sites. Rustdoc links are checked in Core Tests.
# Changelog and release notes are reported and do not fail the run.
name: Docs links

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  docs:
    name: docs links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Current pages
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          output: lychee/docs-current.md
          args: >-
            --config .lychee.toml
            --root-dir ${{ github.workspace }}/docs/content
            --fallback-extensions md,mdx
            --exclude-path docs/content/docs/updates/changelog\.mdx
            --exclude-path docs/content/docs/updates/release-notes/
            docs/content

      - name: Changelog and release notes
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          jobSummary: false
          lycheeVersion: v0.24.2
          output: lychee/docs-history.md
          args: >-
            --config .lychee.toml
            --root-dir ${{ github.workspace }}/docs/content
            --fallback-extensions md,mdx
            docs/content/docs/updates/changelog.mdx
            docs/content/docs/updates/release-notes

  docs-v2:
    name: docs-v2 links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Current pages
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          output: lychee/docs-v2-current.md
          args: >-
            --config .lychee.toml
            --root-dir ${{ github.workspace }}/docs-v2/src/content
            --fallback-extensions md,mdx
            --exclude-path docs-v2/src/content/docs/updates/changelog\.mdx
            --exclude-path docs-v2/src/content/docs/updates/release-notes/
            docs-v2/src/content

      - name: Changelog and release notes
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          jobSummary: false
          lycheeVersion: v0.24.2
          output: lychee/docs-v2-history.md
          args: >-
            --config .lychee.toml
            --root-dir ${{ github.workspace }}/docs-v2/src/content
            --fallback-extensions md,mdx
            docs-v2/src/content/docs/updates/changelog.mdx
            docs-v2/src/content/docs/updates/release-notes
